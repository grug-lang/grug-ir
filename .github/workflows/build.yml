name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.7.17", "3.11.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM 22 Toolchain Tarball
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/llvm-22-cache
          key: ${{ runner.os }}-llvm-22-tar-v1

      - name: Cache pyenv and Python
        uses: actions/cache@v4
        with:
          path: ~/.pyenv
          key: ${{ runner.os }}-pyenv-${{ matrix.python-version }}

      - name: Install specific Clang version
        run: |
          if [ "${{ steps.cache-llvm.outputs.cache-hit }}" = "true" ]; then
            echo "Cache hit! Extracting pre-compiled LLVM 22 toolchain..."
            sudo tar -I zstd -xf ~/llvm-22-cache/llvm-22.tar.zst -C /
          else
            echo "Cache miss! Installing LLVM 22 via APT..."
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 22
            sudo apt-get install -y clang-22 llvm-22-tools lld-22

            echo "Packaging LLVM 22 toolchain into a local archive..."
            mkdir -p ~/llvm-22-cache
            sudo tar -I zstd -cf ~/llvm-22-cache/llvm-22.tar.zst -C / usr/lib/llvm-22
            sudo chown -R $(whoami):$(whoami) ~/llvm-22-cache
          fi

          # Establish explicit system symlinks to the toolchain binaries
          sudo ln -sf /usr/lib/llvm-22/bin/clang       /usr/bin/clang
          sudo ln -sf /usr/lib/llvm-22/bin/lld         /usr/bin/lld
          sudo ln -sf /usr/lib/llvm-22/bin/lld         /usr/bin/ld.lld
          sudo ln -sf /usr/lib/llvm-22/bin/FileCheck   /usr/bin/FileCheck
          sudo ln -sf /usr/lib/llvm-22/bin/llvm-config /usr/bin/llvm-config

      - name: Install pyenv and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential zlib1g-dev libssl-dev libbz2-dev \
            libreadline-dev libsqlite3-dev libffi-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev libgdbm-dev uuid-dev \
            curl git wget

          # Only run the installer if the directory wasn't restored from cache
          if [ ! -d "$HOME/.pyenv" ]; then
            curl https://pyenv.run | bash
          fi

      - name: Install Python ${{ matrix.python-version }}
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

          # The -s flag tells pyenv to skip compilation if the version is already installed via cache
          pyenv install -s ${{ matrix.python-version }}
          pyenv global ${{ matrix.python-version }}
          python --version

      # Black 24+ requires Python 3.8+, so only check formatting on 3.11.9.
      # The formatter is version-agnostic: checking once is enough.
      - name: Check Black (Python ${{ matrix.python-version }})
        if: matrix.python-version == '3.11.9'
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$HOME/.local/bin:$PATH"

          pip install black --user
          black --check .

      - name: Install pycparser and coverage (Python ${{ matrix.python-version }})
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

          pip install --upgrade pip --user
          pip install pycparser pycparser-fake-libc coverage --user

      - name: Run tests with coverage (Python ${{ matrix.python-version }})
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$HOME/.local/bin:$PATH"

          python tests.py
          coverage report -m --fail-under=100
