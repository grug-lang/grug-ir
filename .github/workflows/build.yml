name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.7.17", "3.11.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Install specific Clang version
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          # The script sets up the repository
          sudo ./llvm.sh 22

          # Install clang and the tools package containing FileCheck
          sudo apt-get install -y clang-22 llvm-22-tools

          # Update symlinks for clang and FileCheck
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo ln -s /usr/bin/FileCheck-22 /usr/bin/FileCheck

      # TODO: REMOVE!
      - name: Print clang version
        run: clang --version

      # TODO: REMOVE!
      - name: Print linker version
        run: ld.lld --version

      - name: Install pyenv and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential zlib1g-dev libssl-dev libbz2-dev \
            libreadline-dev libsqlite3-dev libffi-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev libgdbm-dev uuid-dev \
            curl git wget

          curl https://pyenv.run | bash

      - name: Install Python ${{ matrix.python-version }}
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

          pyenv install -s ${{ matrix.python-version }}
          pyenv global ${{ matrix.python-version }}
          python --version

      # Black 24+ requires Python 3.8+, so only check formatting on 3.11.9.
      # The formatter is version-agnostic: checking once is enough.
      - name: Check Black (Python ${{ matrix.python-version }})
        if: matrix.python-version == '3.11.9'
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$HOME/.local/bin:$PATH"

          pip install black --user
          black --check .

      # pycparser is the one explicitly allowed dependency (c2grir.py).
      # All other scripts must work without it, so it is installed last and
      # nothing else is added — enforcing the no-dependencies requirement.
      - name: Install pycparser and coverage (Python ${{ matrix.python-version }})
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

          pip install --upgrade pip --user
          pip install coverage pycparser --user

      - name: Run tests with coverage (Python ${{ matrix.python-version }})
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$HOME/.local/bin:$PATH"

          coverage run tests.py
          coverage report -m --fail-under=100
