name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.7.17", "3.11.9"]

    steps:
      - uses: actions/checkout@v4

      - name: Cache Clang/LLVM APT packages
        uses: actions/cache@v4
        with:
          path: apt-cache
          key: ${{ runner.os }}-apt-llvm-22-v1

      - name: Install specific Clang version
        run: |
          # Redirect APT archives to a local directory for caching
          mkdir -p apt-cache/partial
          echo 'Dir::Cache::Archives "'$(pwd)'/apt-cache";' | sudo tee /etc/apt/apt.conf.d/99-local-archives

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

          sudo apt-get install -y clang-22 llvm-22-tools lld-22

          # Remove the config so it doesn't interfere with downstream apt-get steps
          sudo rm /etc/apt/apt.conf.d/99-local-archives
          
          # Fix permissions so the GitHub Actions runner can save the cache post-run
          sudo chown -R $(whoami):$(whoami) apt-cache

          sudo ln -sf /usr/bin/clang-22       /usr/bin/clang
          sudo ln -sf /usr/bin/lld-22         /usr/bin/lld
          sudo ln -sf /usr/bin/lld-22         /usr/bin/ld.lld
          sudo ln -sf /usr/bin/FileCheck-22   /usr/bin/FileCheck
          sudo ln -sf /usr/bin/llvm-config-22 /usr/bin/llvm-config

      - name: Install pyenv and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential zlib1g-dev libssl-dev libbz2-dev \
            libreadline-dev libsqlite3-dev libffi-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev libgdbm-dev uuid-dev \
            curl git wget

          curl https://pyenv.run | bash

      - name: Install Python ${{ matrix.python-version }}
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

          pyenv install -s ${{ matrix.python-version }}
          pyenv global ${{ matrix.python-version }}
          python --version

      # Black 24+ requires Python 3.8+, so only check formatting on 3.11.9.
      # The formatter is version-agnostic: checking once is enough.
      - name: Check Black (Python ${{ matrix.python-version }})
        if: matrix.python-version == '3.11.9'
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$HOME/.local/bin:$PATH"

          pip install black --user
          black --check .

      - name: Install pycparser and coverage (Python ${{ matrix.python-version }})
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

          pip install --upgrade pip --user
          pip install pycparser pycparser-fake-libc coverage --user

      - name: Run tests with coverage (Python ${{ matrix.python-version }})
        run: |
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$HOME/.local/bin:$PATH"

          python tests.py
          coverage report -m --fail-under=100
